<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darbo kodeksas — cited answers</title>
<meta name="description" content="Ask a Lithuanian employment-law question, get an answer grounded in a specific article of the Labour Code — or an honest refusal.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Design tokens adapted from Beautiful UI (beautifului.dev), MIT licensed. */
:root{
  --page:oklch(98.5% .001 286.376); --canvas:oklch(96.1% .002 247.84);
  --surface:oklch(100% 0 0); --inset:oklch(97.9% .002 247.839);
  --hover:oklch(97% .002 247.839); --hover-2:oklch(93.3% .003 247.86);
  --ink:oklch(24.7% .006 258.361); --ink-2:oklch(50.6% .01 264.477);
  --ink-3:oklch(69.5% .009 264.505);
  --line:oklch(94.6% .003 264.542); --line-strong:oklch(91.2% .005 258.326);
  --accent:oklch(62.6% .205 254.947); --accent-ink:oklch(55.6% .187 255.617);
  --accent-tint:oklch(96% .019 252.878);
  --green:oklch(60.3% .155 150.883); --green-tint:oklch(95.8% .017 159.118);
  --orange:oklch(68.9% .179 49.902); --orange-tint:oklch(96.4% .021 67.581);
  --red:oklch(62.1% .192 23.042); --red-tint:oklch(95.6% .017 17.462);
  --shadow-card:0 0 0 1px var(--line),0 1px 2px oklch(0% 0 0/.04);
  --shadow-raised:0 0 0 1px var(--line),0 4px 12px oklch(0% 0 0/.06);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:oklch(22.6% .004 264.485); --canvas:oklch(24.2% .005 264.4);
    --surface:oklch(26.4% .006 264.4); --inset:oklch(28.4% .006 264.4);
    --hover:oklch(30% .006 264.4); --hover-2:oklch(33% .007 264.4);
    --ink:oklch(96.4% .002 247.839); --ink-2:oklch(73.1% .008 260.731);
    --ink-3:oklch(56% .009 264.5);
    --line:oklch(32% .007 264.47); --line-strong:oklch(39% .009 264.47);
    --accent:oklch(70% .17 255); --accent-ink:oklch(78% .15 255);
    --accent-tint:oklch(31% .06 255);
    --green:oklch(70% .15 151); --green-tint:oklch(30% .05 151);
    --orange:oklch(75% .16 50); --orange-tint:oklch(32% .06 50);
    --red:oklch(70% .17 23); --red-tint:oklch(31% .06 23);
    --shadow-card:0 0 0 1px var(--line),0 1px 2px oklch(0% 0 0/.3);
    --shadow-raised:0 0 0 1px var(--line),0 4px 14px oklch(0% 0 0/.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums}

/* ---- header ---- */
header{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--page) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:760px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:10px}
.brand{font-size:13px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--ink-3);font-weight:400}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none;
  box-shadow:0 0 0 3px var(--green-tint)}
.langsw{margin-left:auto;display:flex;gap:1px;background:var(--inset);padding:2px;border-radius:8px;
  box-shadow:inset 0 0 0 1px var(--line)}
.langsw button{border:0;background:none;color:var(--ink-3);font:inherit;font-size:11px;font-weight:500;
  padding:4px 9px;border-radius:6px;cursor:pointer;letter-spacing:.03em}
.langsw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-card)}
.langsw button:hover{color:var(--ink)}
.langsw button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hlinks{display:flex;gap:4px;margin-left:6px}
.hlinks a{color:var(--ink-2);text-decoration:none;font-size:12px;padding:5px 9px;border-radius:7px}
.hlinks a:hover{background:var(--hover);color:var(--ink)}

main{max-width:760px;margin:0 auto;padding:26px 20px 80px}

/* ---- intro ---- */
.lede{font-size:19px;line-height:1.4;letter-spacing:-.015em;margin:0 0 7px;font-weight:600;text-wrap:balance}
.sub{color:var(--ink-2);margin:0 0 20px;max-width:56ch}
.sub b{color:var(--ink);font-weight:500}

/* ---- composer ---- */
.composer{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-card);
  padding:10px;transition:box-shadow .15s}
.composer:focus-within{box-shadow:var(--shadow-raised)}
textarea{width:100%;border:0;background:none;color:var(--ink);font:inherit;resize:none;
  padding:6px 6px 2px;outline:none;min-height:46px;line-height:1.5}
textarea::placeholder{color:var(--ink-3)}
.crow{display:flex;align-items:center;gap:8px;padding:2px 2px 0}
.hint{color:var(--ink-3);font-size:11.5px}
.ask{margin-left:auto;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:500;
  padding:7px 15px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px}
.ask:hover{background:var(--accent-ink)}
.ask:disabled{opacity:.5;cursor:not-allowed}
.ask:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.examples{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.ex{background:var(--surface);border:0;box-shadow:0 0 0 1px var(--line);color:var(--ink-2);
  font:inherit;font-size:12px;padding:6px 11px;border-radius:20px;cursor:pointer;text-align:left}
.ex:hover{color:var(--ink);box-shadow:0 0 0 1px var(--line-strong);background:var(--hover)}
.ex:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- pipeline trace ---- */
.trace{margin-top:20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-card);
  padding:13px 15px}
.trace-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-weight:500}
.spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong);
  border-top-color:var(--accent);animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.steps{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.steps li{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-3);
  opacity:.45;transition:opacity .3s,color .3s}
.steps li.on{opacity:1;color:var(--ink-2)}
.steps li.done{opacity:1;color:var(--ink-3)}
.tick{width:14px;height:14px;border-radius:50%;flex:none;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px var(--line-strong);font-size:9px;color:var(--surface)}
.steps li.done .tick{background:var(--green);box-shadow:none}
.steps li.on .tick{box-shadow:inset 0 0 0 1.5px var(--accent)}

/* ---- answer ---- */
.card{margin-top:20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-card);
  overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pill{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;letter-spacing:.01em}
.pill.ok{background:var(--green-tint);color:var(--green)}
.pill.no{background:var(--orange-tint);color:var(--orange)}
.pill.err{background:var(--red-tint);color:var(--red)}
.ans{padding:15px 16px 16px;font-size:13.5px;line-height:1.65}
.ans p{margin:0 0 10px}
.ans p:last-child{margin-bottom:0}
.ans ul{margin:0 0 10px;padding-left:18px}
.ans li{margin-bottom:4px}
.ans strong{font-weight:600}
.cite{display:inline-flex;align-items:center;gap:3px;background:var(--accent-tint);
  color:var(--accent-ink);font-family:"JetBrains Mono",monospace;font-size:11.5px;font-weight:500;
  padding:1px 6px;border-radius:5px;cursor:pointer;border:0;vertical-align:baseline}
.cite:hover{background:var(--accent);color:#fff}

/* ---- confidence meter ---- */
.conf{padding:0 16px 15px}
.conf-top{display:flex;align-items:baseline;gap:7px;font-size:11.5px;color:var(--ink-3);margin-bottom:7px}
.conf-top b{color:var(--ink);font-weight:600;font-size:13px}
.scale{position:relative;height:5px;background:var(--inset);border-radius:3px;
  box-shadow:inset 0 0 0 1px var(--line)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--green)}
.fill.no{background:var(--orange)}
.thr{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink-2);border-radius:1px}
.thr{box-shadow:0 0 0 2px var(--surface)}

/* ---- sources ---- */
.src-h{font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;
  padding:0 16px;margin:2px 0 8px}
.srcs{padding:0 10px 10px;display:flex;flex-direction:column;gap:3px}
.src{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;
  text-decoration:none;color:inherit;transition:background .15s}
.src:hover{background:var(--hover)}
.src.hl{background:var(--accent-tint)}
.num{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;color:var(--accent-ink);
  background:var(--accent-tint);padding:3px 8px;border-radius:6px;flex:none;min-width:44px;text-align:center}
.st{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;display:flex;gap:10px}
.sc i{font-style:normal}
.sc b{color:var(--ink-2);font-weight:500}
.bar{width:34px;height:3px;background:var(--inset);border-radius:2px;overflow:hidden;flex:none}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:2px}

.note{padding:11px 16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:11.5px}
.note a{color:var(--accent-ink)}

/* ---- footer ---- */
footer{max-width:760px;margin:0 auto;padding:0 20px 60px;color:var(--ink-3);font-size:11.5px}
.facts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.fact{background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:7px;padding:7px 11px}
.fact b{color:var(--ink);font-weight:600;font-family:"JetBrains Mono",monospace}
.fact i{font-style:normal;display:block;font-size:10.5px;margin-top:1px}
footer p{margin:0 0 7px;max-width:64ch;line-height:1.6}
footer a{color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.sc i.cos{display:none}.hlinks a.opt{display:none}}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <span class="dot" title="live"></span>
    <span class="brand">Darbo kodeksas <span data-i="tag"></span></span>
    <div class="langsw" role="group" aria-label="Language">
      <button data-lang="lt" aria-pressed="true">LT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <nav class="hlinks">
      <a class="opt" href="/health">API</a>
      <a href="https://github.com/dziugasmarcenas-ui/legal-rag">Repo</a>
    </nav>
  </div>
</header>

<main>
  <h1 class="lede" data-i="lede"></h1>
  <p class="sub" data-i="sub"></p>

  <div class="composer">
    <textarea id="q" rows="2"></textarea>
    <div class="crow">
      <span class="hint" data-i="hint"></span>
      <button class="ask" id="ask" data-i="ask"></button>
    </div>
  </div>

  <div class="examples" id="ex"></div>
  <div id="out"></div>
</main>

<footer>
  <div class="facts" id="facts"></div>
  <p data-i="how"></p>
  <p data-i="nla"></p>
</footer>

<script>
const I18N={
 lt:{
  tag:"· atsakymai su šaltiniais",
  lede:"Klauskite apie Lietuvos darbo teisę – atsakymą pagrįsime konkrečiu straipsniu.",
  sub:'Atsakymai grindžiami suvestine <b>Darbo kodekso</b> redakcija, galiojančia nuo 2026-06-07 iki 2026-10-31. Kiekviename atsakyme nurodomas konkretus straipsnis. Jei Kodekse atsakymo nėra, sistema tai aiškiai pasako ir nespėlioja.',
  ph:"Įveskite klausimą lietuviškai, pvz.: Kiek dienų kasmetinių atostogų man priklauso?",
  hint:"⌘/Ctrl + Enter", ask:"Klausti",
  answered:"Atsakyta", refused:"Patikimam atsakymui nepakanka duomenų",
  answeredSub:"atsakymas pagrįstas toliau nurodytais straipsniais",
  refusedSub:"Darbo kodekse atsakymo į šį klausimą nerasta",
  considered:n=>`Įvertinta straipsnių: ${n}`,
  conf:"geriausiai tikusio straipsnio atitiktis", gateAt:"riba – 0,54",
  above:"virš ribos – atsakyta", below:"žemiau ribos – neatsakyta",
  rel:"atitiktis", cos:"kos. panaš.",
  note:'Citatas prideda paieškos sistema, o ne kalbos modelis. Informaciją pasitikrinkite <a href="https://www.e-tar.lt/portal/lt/legalAct/f6d686707e7011e6b969d7ae07280e89/asr">e-TAR</a>.',
  tooMany:"Per daug užklausų", capped:"Pasiekta dienos riba",
  netErr:"Ryšio klaida", netMsg:"Paslaugos pasiekti nepavyko. Ji gali būti paleidžiama iš naujo – pabandykite dar kartą po kelių akimirkų.",
  unavail:"Paslauga nepasiekiama", unavailMsg:"Atsakymo sugeneruoti nepavyko, tačiau susiję straipsniai buvo rasti.",
  retry:s=>`Bandykite dar kartą maždaug po ${Math.ceil(s/60)} min.`,
  working:"Rengiamas atsakymas…",
  steps:[["Klausimas paverčiamas vektoriumi","voyage-3, input_type=query"],
         ["Paieška atliekama 257 straipsniuose","kosinusinis panašumas"],
         ["Straipsniai surikiuojami pagal tinkamumą","rerank-2.5, kryžminis koduotuvas"],
         ["Vertinamas atsakymo patikimumas","taikoma 0,54 riba"],
         ["Formuluojamas atsakymas","claude-haiku-4-5, remiantis tik rastais straipsniais"]],
  facts:["straipsnių","Recall@1","patikimumo riba","redakcija galioja nuo"],
  how:"Paieška pagal prasmę atrenka galimai tinkamus straipsnius, o kryžminis koduotuvas surikiuoja juos pagal atitiktį klausimui. Tada sistema įvertina, ar turimos informacijos pakanka patikimam atsakymui. Citatas prideda paieškos sistema, o ne kalbos modelis, todėl rodomas šaltinis visada yra iš tikrųjų rastas straipsnis.",
  nla:'<b>Tai nėra teisinė konsultacija.</b> Tai techninė demonstracija, pagrįsta viena suvestine vieno kodekso redakcija. Svarbią informaciją pasitikrinkite <a href="https://www.e-tar.lt/portal/lt/legalAct/f6d686707e7011e6b969d7ae07280e89/asr">e-TAR</a> arba kreipkitės į specialistą. Metodika, vertinimo rezultatai ir apribojimai aprašyti projekto <a href="https://github.com/dziugasmarcenas-ui/legal-rag">saugykloje</a>. Sąsajos komponentai pritaikyti iš <a href="https://www.beautifului.dev/">Beautiful UI</a> (MIT).'
 },
 en:{
  tag:"· cited answers",
  lede:"Ask about Lithuanian employment law. Get the article.",
  sub:'Answers come from the consolidated <b>Darbo kodeksas</b>, edition valid 2026-06-07 to 2026-10-31. Every answer cites a specific article — and when the Code does not cover your question, it says so instead of guessing.',
  ph:"Ask in Lithuanian — e.g. kiek dienų kasmetinių atostogų man priklauso?",
  hint:"⌘/Ctrl + Enter", ask:"Ask",
  answered:"Answered", refused:"No confident answer",
  answeredSub:"grounded in the articles below",
  refusedSub:"the Code does not appear to cover this",
  considered:n=>`Considered ${n} article${n>1?"s":""}`,
  conf:"relevance of the best article", gateAt:"gate at 0.54",
  above:"above — answered", below:"below — refused",
  rel:"rel", cos:"cos",
  note:'Citations are attached from the retriever, not written by the model. Verify against <a href="https://www.e-tar.lt/portal/lt/legalAct/f6d686707e7011e6b969d7ae07280e89/asr">e-TAR</a>.',
  tooMany:"Too many requests", capped:"Daily cap reached",
  netErr:"Network error", netMsg:"Could not reach the service. It may be restarting — try again in a moment.",
  unavail:"Unavailable", unavailMsg:"The answering model did not respond. The articles below were still retrieved locally.",
  retry:s=>`Try again in about ${Math.ceil(s/60)} minute(s).`,
  working:"Working…",
  steps:[["Embedding the question","voyage-3, input_type=query"],
         ["Searching 257 articles","cosine similarity over the corpus"],
         ["Reranking candidates","rerank-2.5 cross-encoder"],
         ["Checking confidence","against the 0.54 gate"],
         ["Writing the answer","claude-haiku-4-5, retrieved articles only"]],
  facts:["articles","Recall@1","gate threshold","edition from"],
  how:"Retrieval finds candidate articles by meaning, a cross-encoder reranks them, and a confidence gate decides whether there is enough support to answer at all. Citations are attached from the retriever, never written by the language model — so a source shown here is an article that was actually retrieved.",
  nla:'<b>Not legal advice.</b> A technical demonstration over one consolidated edition of one code. The corpus, the retrieval and the benchmark are Lithuanian; English answers are translated from those same Lithuanian articles. Verify anything that matters against <a href="https://www.e-tar.lt/portal/lt/legalAct/f6d686707e7011e6b969d7ae07280e89/asr">e-TAR</a> or a qualified professional. Method, measurements and limitations are in the <a href="https://github.com/dziugasmarcenas-ui/legal-rag">repository</a>. UI primitives adapted from <a href="https://www.beautifului.dev/">Beautiful UI</a> (MIT).'
 }
};

// Example questions stay Lithuanian in both modes: they are the frozen
// benchmark questions, and retrieval runs against a Lithuanian corpus.
const EXAMPLES=[
 "Kiek dienų kasmetinių atostogų man priklauso per metus?",
 "Įmonė naikina mano poziciją. Kiek laiko prieš tai turi mane įspėti?",
 "Ar galiu dirbti viršvalandžius ir kiek daugiausia?",
 "Kiek trunka nėštumo ir gimdymo atostogos?",
 "Kiek pensijos susikaupsiu per 10 metų?"
];
const $=s=>document.querySelector(s);
const out=$("#out"), qEl=$("#q"), askBtn=$("#ask");
let LANG=localStorage.getItem("lang")
  || ((navigator.language||"").toLowerCase().startsWith("lt") ? "lt" : "en");
let T=I18N[LANG], HEALTH=null;

function applyLang(){
  T=I18N[LANG];
  document.documentElement.lang=LANG;
  localStorage.setItem("lang",LANG);
  document.querySelectorAll("[data-lang]").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.lang===LANG)));
  document.querySelectorAll("[data-i]").forEach(el=>{
    const v=T[el.dataset.i]; if(typeof v==="string") el.innerHTML=v;
  });
  qEl.placeholder=T.ph;
  renderFacts();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{
  LANG=b.dataset.lang; applyLang(); out.innerHTML="";
});

EXAMPLES.forEach(t=>{
  const b=document.createElement("button");
  b.className="ex"; b.textContent=t.length>52?t.slice(0,50)+"…":t; b.title=t;
  b.onclick=()=>{qEl.value=t; ask();};
  $("#ex").append(b);
});

function renderFacts(){
  if(!HEALTH)return;
  const v=["257","0.880","0.54",HEALTH.edition_from];
  $("#facts").innerHTML=v.map((val,i)=>
    `<div class="fact"><b>${val}</b><i>${T.facts[i]}</i></div>`).join("");
}
fetch("/health").then(r=>r.json()).then(h=>{HEALTH=h;renderFacts();}).catch(()=>{});

const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function format(text, articles){
  const blocks=esc(text).split(/\n{2,}/).map(b=>{
    const lines=b.split("\n").map(l=>l.trim()).filter(Boolean);
    if(lines.every(l=>/^[-*•]\s/.test(l)))
      return "<ul>"+lines.map(l=>"<li>"+l.replace(/^[-*•]\s/,"")+"</li>").join("")+"</ul>";
    return "<p>"+lines.join("<br>")+"</p>";
  }).join("");
  return blocks
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\[\s*(\d+(?:-\d+)?)\s*(?:straipsni\S*|art\S*)?\s*\]/gi,
      (m,n)=>articles.includes(n)?`<button class="cite" data-a="${n}">${n} str.</button>`:m);
}
function render(h){out.innerHTML=h; out.scrollIntoView({behavior:"smooth",block:"nearest"});}

function trace(){
  render(`<div class="trace"><div class="trace-h"><span class="spin"></span>${T.working}</div>
    <ul class="steps">${T.steps.map((s,i)=>
      `<li id="s${i}"><span class="tick">✓</span><span>${s[0]} <span style="color:var(--ink-3)">· ${s[1]}</span></span></li>`
    ).join("")}</ul></div>`);
  let i=0; const first=$("#s0"); if(first)first.classList.add("on");
  return setInterval(()=>{
    const c=$("#s"+i); if(!c)return;
    c.classList.remove("on"); c.classList.add("done"); i++;
    const n=$("#s"+i); if(n)n.classList.add("on");
  },900);
}
function sourcesHTML(s){
  return `<div class="src-h">${T.considered(s.length)}</div>
    <div class="srcs">${s.map(x=>`
      <div class="src" id="a${x.article}">
        <span class="num">${x.citation}</span>
        <span class="st" title="${esc(x.title)}">${esc(x.title)}</span>
        <span class="sc"><i><b>${x.rerank_score==null?"—":x.rerank_score.toFixed(3)}</b> ${T.rel}</i>
          <i class="cos">${x.cosine_score.toFixed(3)} ${T.cos}</i></span>
        <span class="bar"><i style="width:${Math.round((x.rerank_score||0)*100)}%"></i></span>
      </div>`).join("")}</div>`;
}
function meterHTML(c, refused){
  const pct=Math.max(0,Math.min(1,c))*100;
  return `<div class="conf">
    <div class="conf-top"><b>${c.toFixed(4)}</b> ${T.conf} · ${T.gateAt} ·
      <span>${refused?T.below:T.above}</span></div>
    <div class="scale"><span class="fill${refused?" no":""}" style="width:${pct}%"></span>
      <span class="thr" style="left:54%"></span></div></div>`;
}

async function ask(){
  const q=qEl.value.trim();
  if(q.length<3){qEl.focus();return;}
  askBtn.disabled=true;
  const t=trace();
  let res,data;
  try{
    res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q,lang:LANG})});
    data=await res.json();
  }catch(e){
    clearInterval(t); askBtn.disabled=false;
    return render(`<div class="card"><div class="card-h"><span class="pill err">${T.netErr}</span></div>
      <div class="ans"><p>${T.netMsg}</p></div></div>`);
  }
  clearInterval(t); askBtn.disabled=false;

  if(res.status===429||res.status===503){
    return render(`<div class="card"><div class="card-h">
      <span class="pill err">${res.status===429?T.tooMany:T.capped}</span></div>
      <div class="ans"><p>${esc(data.detail||"")}</p>
      ${data.retry_after_seconds?`<p style="color:var(--ink-3)">${T.retry(data.retry_after_seconds)}</p>`:""}
      </div></div>`);
  }
  if(!res.ok||data.error){
    return render(`<div class="card"><div class="card-h"><span class="pill err">${T.unavail}</span></div>
      <div class="ans"><p>${T.unavailMsg}</p></div>
      ${data.sources?sourcesHTML(data.sources):""}</div>`);
  }

  const ids=(data.sources||[]).map(s=>s.article), refused=!!data.refused;
  render(`<div class="card">
    <div class="card-h"><span class="pill ${refused?"no":"ok"}">${refused?T.refused:T.answered}</span>
      <span style="color:var(--ink-3);font-size:11.5px">${refused?T.refusedSub:T.answeredSub}</span></div>
    <div class="ans">${format(data.answer||"",ids)}</div>
    ${meterHTML(data.confidence||0,refused)}
    ${data.sources&&data.sources.length?sourcesHTML(data.sources):""}
    <div class="note">${T.note}</div></div>`);

  out.querySelectorAll(".cite").forEach(c=>c.onclick=()=>{
    const el=document.getElementById("a"+c.dataset.a); if(!el)return;
    out.querySelectorAll(".src").forEach(s=>s.classList.remove("hl"));
    el.classList.add("hl"); el.scrollIntoView({behavior:"smooth",block:"center"});
  });
}
askBtn.onclick=ask;
qEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();ask();}
});
applyLang();
</script>
</body>
</html>
